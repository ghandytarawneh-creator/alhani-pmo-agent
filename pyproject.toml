[project]
name = "alhani-pmo-agent"
version = "0.1.0"
description = "Conversational Construction Management PMO agent for ALHANI Company"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents>=1.1.2,<1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
